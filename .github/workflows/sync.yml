name: Westminster scheduled sync
on:
  schedule:
    - cron: '0 7 * * 1,4'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: westminster-datahub-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Restore persistent dataset
        uses: actions/cache/restore@v4
        with:
          path: |
            data/datahub/planning_leads.db
            data/datahub/mode.txt
            data/datahub/raw
            data/datahub/markdown
            data/datahub/digests
            data/datahub/logs
          key: datahub-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: datahub-state-
      - name: Incremental pipeline
        id: pipeline
        run: python run.py --source datahub --limit 10000 --digest-days 28
      - name: Data quality audit
        if: success()
        run: python audit_data.py
      - name: Build offline presentation
        if: success()
        run: python build_presentation.py
      - name: Preserve progress, including recoverable partial writes
        if: always() && steps.pipeline.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: |
            data/datahub/planning_leads.db
            data/datahub/mode.txt
            data/datahub/raw
            data/datahub/markdown
            data/datahub/digests
            data/datahub/logs
          key: datahub-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Downloadable report and digests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: westminster-digests-${{ github.run_id }}
          path: |
            data/datahub/logs/last_run.json
            data/datahub/logs/audit.json
            data/datahub/digests/
            data/presentation/index.html
          retention-days: 7
          if-no-files-found: warn
      - name: Run summary
        if: always()
        run: python workflow_summary.py
